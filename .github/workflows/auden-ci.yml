name: Auden CI

on:
  push:
    paths: ["auden/**", ".github/workflows/auden-ci.yml"]
  pull_request:
    paths: ["auden/**", ".github/workflows/auden-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: auden

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auden/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: RLS tests (PostgreSQL)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql > /dev/null
          npm run test:rls
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: E2E tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: auden/playwright-report
          retention-days: 7
